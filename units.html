<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const msg = document.getElementById('msg');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('p').value;
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot decrypt here (needs https).'; return; }
  msg.textContent = 'Decrypting…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.iv) }, key, un(P.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = 'Wrong password, or the file is damaged.'; }
});
</script></body></html>
